<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="590" viewBox="0 0 1620 590" role="img" aria-label="apply.sh, or the GitHub Actions workflows, builds the Flask service's container image and pushes it to the flask-app repository in Amazon ECR. App Runner pulls it with a build role and runs it as flask-app-runner on port 8000 with one vCPU and 2 GB, health-checking /gtg; clients reach it over HTTPS. Its run role lets it read and write the Candidates table in DynamoDB. The workflows keep Terraform state in an S3 bucket with a DynamoDB lock table, created by 00-backend."><defs><marker id="a_e_push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_ddb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1620" height="590" fill="#ffffff"/><path d="M250.0,150 V235" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_push)"/><text x="264.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">docker push</text><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_https)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTPS</text><path d="M460,295.0 H595" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_pull)"/><text x="530.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">image pull</text><path d="M1020,295.0 H1155" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_ddb)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">read / write</text><path d="M40,95.0 H20 V495.0 H35" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_state)"/><text x="34" y="220" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">workflows only</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">apply.sh or GitHub Actions</text><text x="104.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">docker build --push, terraform</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Postman / curl</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">from the internet</text><rect x="40" y="240" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><g transform="translate(60,280.0) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g><text x="104.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Amazon ECR</text><text x="104.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">flask-app:flask-app-rc1</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="664.0" y="291.